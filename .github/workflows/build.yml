name: build

# Builds FrameProbe on a real Windows runner with MSVC, then packages an
# Inno Setup installer. Both the portable .exe and FrameProbeSetup.exe are
# uploaded as downloadable artifacts. On a tag push (v*) they are also attached
# to a GitHub Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake, MSVC x64)
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      # Optional: bundle PresentMon so frame-time capture works out of the box.
      # PresentMon is MIT-licensed (Intel GameTechDev). Comment this step out to
      # ship the installer without it.
      - name: Fetch PresentMon (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\Release\tools | Out-Null
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/GameTechDev/PresentMon/releases/latest" -Headers @{ "User-Agent" = "frameprobe-ci" }
          $asset = $rel.assets | Where-Object { $_.name -match "PresentMon.*x64.*\.exe$" } | Select-Object -First 1
          if ($asset) {
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "build\Release\tools\PresentMon.exe"
            Write-Host "Bundled $($asset.name)"
          } else {
            Write-Host "No PresentMon x64 asset found; installer will ship without it."
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DBuildDir="build\Release" installer\FrameProbe.iss

      - name: Stage portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\FrameProbe-portable\tools | Out-Null
          Copy-Item build\Release\FrameProbe.exe dist\FrameProbe-portable\
          Copy-Item README.md dist\FrameProbe-portable\README.txt
          Copy-Item tools\README.md dist\FrameProbe-portable\tools\README.txt
          if (Test-Path build\Release\tools\PresentMon.exe) {
            Copy-Item build\Release\tools\PresentMon.exe dist\FrameProbe-portable\tools\
          }
          Compress-Archive -Path dist\FrameProbe-portable\* -DestinationPath dist\FrameProbe-portable.zip -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameProbeSetup
          path: installer\FrameProbeSetup.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameProbe-portable
          path: dist\FrameProbe-portable.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer\FrameProbeSetup.exe
            dist\FrameProbe-portable.zip
